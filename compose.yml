services:
  authentication-api:
    privileged: true
    container_name: authentication-api
    restart: unless-stopped
    env_file:
      - .env
    build:
      target: api-prd
    environment:
      - NODE_ENV=production
    ports:
      - '8080:8080'
    volumes:
      - api_modules:/usr/authentication/api/node_modules
    depends_on:
      authentication-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  authentication-postgres:
    image: postgres:16-alpine
    container_name: authentication-db
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER:-dummy}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-dummy}
      POSTGRES_DB: ${PG_DB:-authentication}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./entrypoints/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-authentication} -d ${PG_DB:-authentication}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  api_modules:
  postgres_data:
